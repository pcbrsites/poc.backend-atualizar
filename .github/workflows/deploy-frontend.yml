name: Deploy Frontend Build

on:
  workflow_run:
    workflows: ["Build & Publish"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-spa
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: pcbrsites/poc.frontend-atualizar
          path: downloaded-dist

      - name: Update static
        run: |
          rm -rf static/*
          cp -r downloaded-dist/. static/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/
          git diff --staged --quiet || git commit -m "chore: update frontend build"
          git push
